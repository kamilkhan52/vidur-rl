max_iterations: 100
random_seed: 42
diff_based_evolution: false   # full-program rewrites; Flash doesn't reliably follow SEARCH/REPLACE

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  name: "google/gemini-3-flash-preview"
  temperature: 0.8
  models:
    - name: "google/gemini-3-flash-preview"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
      temperature: 0.8
      weight: 1.0

database:
  population_size: 20
  num_islands: 3
  migration_interval: 10

evaluator:
  enable_artifacts: true
  timeout: 64800         # 18 hours hard cap per eval (6 passes × 3h max each)
  cascade_evaluation: false

evolution_trace:
  enabled: true
  format: "jsonl"
  include_code: true
  include_prompts: true
  output_path: "openevolve/evolution_output/traces/evolution_trace.jsonl"
  buffer_size: 1

prompt:
  system_message: |
    You are evolving a reinforcement learning formulation for an LLM request scheduler.

    SYSTEM DESCRIPTION:
    - A Double DQN agent routes incoming LLM inference requests to one of 16 GPU replicas.
    - Model: Llama-2-7b, 16 replicas, A100 GPUs, vLLM-style batched serving.
    - Workload: Tool-agent trace (~23,000 requests) at Scale 1.5 (high load).
    - State features: per-request token counts, per-replica pending work (prefill/decode
      tokens), prefix cache hit ratios, session affinity flags, lookahead queue features,
      and global load statistics.
    - Training is online: reward is received when each request completes. No episodes.
    - Each candidate is trained for 5 iterations over the full trace, with checkpoints
      saved/loaded between iterations. A final inference pass (no exploration) determines
      the score.
    - The baseline is STICKY_LOR (session affinity + least-outstanding-requests).
    - The latency distribution has a long tail — a few requests can have very high
      latency due to KV cache pressure. Scoring uses median E2E (robust to outliers).
      Mean, p95, p99 are also reported.

    WHAT YOU CONTROL:
    - get_rl_config(): hyperparameters dict (architecture, learning rate, exploration
      schedule, buffer sizes, lookahead depth, etc.)
    - compute_reward(e2e_time, ttft, scheduling_delay): reward signal returned to the
      DQN when a request completes. Arguments are in seconds.

    CONSTRAINTS:
    - Function signatures must not change.
    - compute_reward must return a finite float.

    SCORING:
    score = (STICKY_LOR_median - RL_median) / STICKY_LOR_median
    Positive = RL is faster than the heuristic baseline.
